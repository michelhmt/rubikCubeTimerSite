<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学童マルチキューブタイマー</title>
    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- フォント設定 -->
    <link
        href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }

        .timer-font {
            font-family: 'Share Tech Mono', monospace;
        }
    </style>
</head>

<body class="bg-base-300 text-base-content min-h-screen flex flex-col justify-between items-center p-4">

    <!-- ヘッダー ＆ スクランブル -->
    <header class="w-full max-w-4xl flex flex-col items-center gap-3">
        <h1 class="text-2xl font-black text-warning flex items-center gap-2">
            <span class="text-3xl">🧩</span> 学童マルチタイマー
        </h1>
        <div class="card bg-base-100 shadow-xl border border-base-200 w-full p-3 text-center">
            <p class="text-xs text-base-content/60 mb-1">スクランブル</p>
            <div id="scramble" class="text-lg sm:text-xl font-bold tracking-widest text-success">
                R2 U B2 D L2 F2 U' L2 U2 R2
            </div>
        </div>
    </header>

    <!-- タイマーエリア（参加人数に合わせて動的生成） -->
    <main class="w-full max-w-5xl my-4">
        <div id="timer-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- JSでプレイヤーごとのカードが並びます -->
        </div>
    </main>

    <!-- フッター：人数設定ボタン ＆ 保存ボタン -->
    <footer class="w-full max-w-2xl flex flex-col items-center gap-4 border-t border-base-200 pt-4">
        <!-- 人数切替ボタン -->
        <div class="flex items-center gap-2">
            <span class="font-bold text-sm text-base-content/70">さんか人数:</span>
            <div class="join">
                <button class="player-count-btn join-item btn btn-sm btn-neutral" data-count="1">1人</button>
                <button class="player-count-btn join-item btn btn-sm btn-neutral" data-count="2">2人</button>
                <button class="player-count-btn join-item btn btn-sm btn-neutral" data-count="3">3人</button>
                <button class="player-count-btn join-item btn btn-sm btn-neutral" data-count="4">4人</button>
                <button class="player-count-btn join-item btn btn-sm btn-warning" data-count="5">5人</button>
            </div>
        </div>

        <!-- 全員のタイムを保存するボタン -->
        <button id="save-all-btn" class="btn btn-success text-xl font-black w-full text-base-100 shadow-lg">
            全員の記録をSupabaseに保存！
        </button>
    </footer>

    <script src="app.js"></script>
</body>

</html>
