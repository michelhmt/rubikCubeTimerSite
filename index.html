<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance | Rubik's Cube Hub by Michel</title>
    <!-- Google Fonts & Tailwind CSS CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        chakra: ['"Chakra Petch"', 'sans-serif'],
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        cube: {
                            red: '#e74c3c',
                            blue: '#2980b9',
                            orange: '#e67e22',
                            green: '#27ae60',
                            yellow: '#f1c40f',
                            white: '#ecf0f1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 3D キューブアニメーションの設定 */
        .cube-scene {
            width: 140px;
            height: 140px;
            perspective: 800px;
            margin: 0 auto;
        }

        .cube-container {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 12s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        @keyframes rotateCube {
            0% {
                transform: rotateX(-24deg) rotateY(32deg) rotateZ(0deg);
            }

            25% {
                transform: rotateX(156deg) rotateY(122deg) rotateZ(45deg);
            }

            50% {
                transform: rotateX(204deg) rotateY(212deg) rotateZ(-30deg);
            }

            75% {
                transform: rotateX(-110deg) rotateY(302deg) rotateZ(180deg);
            }

            100% {
                transform: rotateX(-24deg) rotateY(392deg) rotateZ(360deg);
            }
        }

        .cube-face {
            position: absolute;
            width: 140px;
            height: 140px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            padding: 5px;
            background: #11141a;
            border: 3px solid #1a202c;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
        }

        .sticker {
            border-radius: 4px;
            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.35);
            transition: all 0.3s ease;
        }

        /* 各面の位置決め (translateZ = 半分の幅 70px) */
        .face-front {
            transform: rotateY(0deg) translateZ(70px);
        }

        .face-back {
            transform: rotateY(180deg) translateZ(70px);
        }

        .face-right {
            transform: rotateY(90deg) translateZ(70px);
        }

        .face-left {
            transform: rotateY(-90deg) translateZ(70px);
        }

        .face-top {
            transform: rotateX(90deg) translateZ(70px);
        }

        .face-bottom {
            transform: rotateX(-90deg) translateZ(70px);
        }

        /* 背景のグリッドグラデーション */
        .cyber-grid {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        }
    </style>
</head>

<body
    class="bg-[#0b0e14] text-slate-100 min-h-screen flex items-center justify-center p-4 cyber-grid font-sans selection:bg-amber-400 selection:text-black">

    <main

        <div class="absolute -top-24 -left-24 w-52 h-52 bg-amber-500/15 rounded-full blur-3xl pointer-events-none">
        </div>
        <div class="absolute -bottom-24 -right-24 w-52 h-52 bg-blue-500/15 rounded-full blur-3xl pointer-events-none">
        </div>

        <!-- 3D ルービックキューブ -->
        <div class="py-6 my-2">

                        <div class="sticker bg-cube-white"></div>
                        <div class="sticker bg-cube-white"></div>
                        <div class="sticker bg-cube-white"></div>
                        <div class="sticker bg-cube-white"></div>
                        <div class="sticker bg-cube-white"></div>
                    </div>
                    <!-- バック (黄) -->

                        <div class="sticker bg-cube-yellow"></div>
                        <div class="sticker bg-cube-yellow"></div>
                        <div class="sticker bg-cube-yellow"></div>
                        <div class="sticker bg-cube-yellow"></div>
                        <div class="sticker bg-cube-yellow"></div>
                        <div class="sticker bg-cube-yellow"></div>
                        <div class="sticker bg-cube-yellow"></div>
                        <div class="sticker bg-cube-yellow"></div>
                    </div>
                    <!-- 右 (赤) -->

                        <div class="sticker bg-cube-red"></div>
                        <div class="sticker bg-cube-red"></div>
                        <div class="sticker bg-cube-red"></div>
                        <div class="sticker bg-cube-red"></div>
                        <div class="sticker bg-cube-red"></div>
                        <div class="sticker bg-cube-red"></div>
                        <div class="sticker bg-cube-red"></div>
                    </div>
                    <!-- 左 (オレンジ) -->
                    <div class="cube-face face-left">
                        <div class="sticker bg-cube-orange"></div>
                        <div class="sticker bg-cube-orange"></div>
                        <div class="sticker bg-cube-orange"></div>
                        <div class="sticker bg-cube-orange"></div>
                        <div class="sticker bg-cube-orange"></div>
                        <div class="sticker bg-cube-orange"></div>
                        <div class="sticker bg-cube-orange"></div>
                        <div class="sticker bg-cube-orange"></div>

                    <!-- 上 (青) -->

                        <div class="sticker bg-cube-blue"></div>
                        <div class="sticker bg-cube-blue"></div>
                        <div class="sticker bg-cube-blue"></div>

                    <!-- 下 (緑) -->

                        <div class="sticker bg-cube-green"></div>
                        <div class="sticker bg-cube-green"></div>
                        <div class="sticker bg-cube-green"></div>
                        <div class="sticker bg-cube-green"></div>
                        <div class="sticker bg-cube-green"></div>
                        <div class="sticker bg-cube-green"></div>
                        <div class="sticker bg-cube-green"></div>
                        <div class="sticker bg-cube-green"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ステータスバッジ -->
        <div
            class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-semibold tracking-wider uppercase mb-4">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>

        </div>

        <!-- メインメッセージ -->
        <h1 class="text-2xl sm:text-3xl font-bold font-chakra tracking-wide text-white mb-3">
            RUBIK'S CUBE HUB
        </h1>
        <p class="text-slate-300 text-sm leading-relaxed mb-6 font-sans">
            現在、アルゴリズムとシステムの再構築を行っています。<br>
            キューブを揃えるように、より使いやすく調整中です。<br>
            メンテナンス完了まで今しばらくお待ちください。
        </p>

        <!-- プログレスバー装飾 -->
        <div class="w-full bg-slate-800/80 rounded-full h-2 mb-8 overflow-hidden p-0.5 border border-slate-700">
            <div
                class="bg-gradient-to-r from-cube-blue via-cube-yellow to-cube-red h-full rounded-full animate-pulse w-3/4">
            </div>
        </div>

        <!-- サイトオーナー / 制作者クレジット表示 -->
        <div class="pt-6 border-t border-slate-700/60 flex flex-col items-center justify-center gap-2">
            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400">Created & Managed by</span>
                <span
                    class="px-2.5 py-0.5 rounded-md bg-gradient-to-r from-amber-500/20 to-orange-500/20 border border-amber-500/30 text-amber-300 text-sm font-bold tracking-wide font-chakra">
                    Michel (ミシェル)
                </span>
            </div>
            <p class="text-[11px] text-slate-500">
                &copy; Michel. All rights reserved.
            </p>
        </div>
    </main>

</body>

</html>
